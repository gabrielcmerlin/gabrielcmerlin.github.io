<!-- Apply dark mode before the page is drawn (avoids a light flash):
     the visitor's saved choice wins, otherwise follow the system setting -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
    /* the page color comes from the stylesheet (render-blocking, already loaded here) */
    window.__themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-bg-color').trim();
  })();
</script>

{% include base_path %}

<script>document.getElementById('theme-color-meta').setAttribute('content', window.__themeColor || '#f3f4f5');</script>
