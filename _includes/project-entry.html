{% assign p = include.post %}
<div class="project-entry">
  <div class="project-head">
    <strong>{{ p.title }}</strong>
    <span class="project-period">{{ p.period }}</span>
  </div>
  <div class="project-role">{{ p.role }}</div>
  <div class="project-desc">{{ p.content | markdownify }}</div>
  {% if p.links %}
  <div class="project-links">{% for l in p.links %}<a href="{{ l.url }}" target="_blank" rel="noopener noreferrer">[{{ l.name }}]</a>{% unless forloop.last %} {% endunless %}{% endfor %}</div>
  {% endif %}
</div>
