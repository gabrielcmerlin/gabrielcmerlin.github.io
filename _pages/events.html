---
layout: archive
title: "Events"
permalink: /events/
author_profile: true
---

{% include base_path %}

<ul class="event-list">
{% for e in site.data.events %}
  <li>
    <strong>{{ e.date }}</strong> {{ e.text }}
    {% if e.photos %}
    <div class="carousel">
      <div class="carousel__track">
        {% for p in e.photos %}
        <img class="carousel__slide{% if forloop.first %} is-active{% endif %}" src="{{ base_path }}{{ p.src }}" alt="{{ p.alt }}"{% if p.position %} style="object-position: {{ p.position }}"{% endif %}>
        {% endfor %}
      </div>
    </div>
    {% endif %}
  </li>
{% endfor %}
</ul>

<script src="{{ base_path }}/assets/js/carousel.js" defer></script>
